<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#487bee" />
    <meta
      name="description"
      content="Nexus Messenger — современный веб-мессенджер с текстовым общением и аудио/видеозвонками"
    />
    <title>Nexus Messenger</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Раннее применение темы, чтобы избежать "мигания" при загрузке
      try {
        var t = localStorage.getItem('nexus-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
